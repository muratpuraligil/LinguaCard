<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* Subtle radial glow */
    .glow {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, rgba(79, 70, 229, 0.12) 45%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .icon-box {
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      margin-bottom: 28px;
      position: relative;
      z-index: 2;
    }
    .book-svg {
      width: 76px;
      height: 76px;
      fill: rgba(255, 255, 255, 0.12);
      stroke: #ffffff;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-title {
      font-size: 46px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 12px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .brand-subtitle {
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="icon-box">
    <svg class="book-svg" viewBox="0 0 24 24">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
    </svg>
  </div>
  <h1 class="brand-title">LinguaCard</h1>
  <p class="brand-subtitle">Yapay Zeka Destekli Kelime Öğrenme Platformu</p>
</body>
</html>
